[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crousandgo-mcp"
version = "0.1.0"
description = "The Crous & Go 1 EUR student menu as MCP tools: list, ask, order and pay with Izly"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "playwright==1.49.1",
]

[project.scripts]
crousandgo = "crousandgo.cli:main"
crousandgo-mcp = "crousandgo.server:main"

[tool.setuptools.packages.find]
where = ["src"]
